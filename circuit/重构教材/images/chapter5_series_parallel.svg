<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520">
<style>
  @media (prefers-color-scheme: dark) {
    svg {
      filter: invert(1) hue-rotate(180deg) !important;
    }
  }
</style>

  <defs>
    <style>
      text{font-family:"Microsoft YaHei","SimSun",sans-serif;font-size:20px;fill:#111}
      .title{font-size:24px;font-weight:700}
      .small{font-size:17px}
      .wire{stroke:#111;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
      .thin{stroke:#111;stroke-width:2;fill:none}
      .panel{fill:#fff;stroke:#111;stroke-width:1.8;rx:8}
    </style>
  </defs>
  
  
<rect class="panel" x="30" y="28" width="440" height="210"/>
  <text class="title" x="55" y="65">电容串联</text>
  <line class="wire" x1="70" y1="130" x2="150" y2="130"/>
  <line class="wire" x1="150" y1="96" x2="150" y2="164"/>
  <line class="wire" x1="174" y1="96" x2="174" y2="164"/>
  <line class="wire" x1="174" y1="130" x2="270" y2="130"/>
  <line class="wire" x1="270" y1="96" x2="270" y2="164"/>
  <line class="wire" x1="294" y1="96" x2="294" y2="164"/>
  <line class="wire" x1="294" y1="130" x2="410" y2="130"/>
  <text x="142" y="190" class="small">C1</text><text x="262" y="190" class="small">C2</text>
  <text x="80" y="220" class="small">1/Ceq = 1/C1 + 1/C2，电容量越小分压越大</text>

  <rect class="panel" x="530" y="28" width="440" height="210"/>
  <text class="title" x="555" y="65">电容并联</text>
  <line class="wire" x1="575" y1="130" x2="640" y2="130"/>
  <line class="wire" x1="640" y1="85" x2="640" y2="175"/>
  <line class="wire" x1="640" y1="85" x2="830" y2="85"/>
  <line class="wire" x1="640" y1="175" x2="830" y2="175"/>
  <line class="wire" x1="720" y1="55" x2="720" y2="115"/>
  <line class="wire" x1="746" y1="55" x2="746" y2="115"/>
  <line class="wire" x1="720" y1="145" x2="720" y2="205"/>
  <line class="wire" x1="746" y1="145" x2="746" y2="205"/>
  <line class="wire" x1="830" y1="85" x2="830" y2="175"/>
  <line class="wire" x1="830" y1="130" x2="930" y2="130"/>
  <text x="758" y="90" class="small">C1</text><text x="758" y="180" class="small">C2</text>
  <text x="580" y="220" class="small">Ceq = C1 + C2，各支路电压相同</text>

  <rect class="panel" x="30" y="275" width="440" height="210"/>
  <text class="title" x="55" y="312">电感串联</text>
  <line class="wire" x1="70" y1="380" x2="130" y2="380"/>
  <path class="wire" d="M130 380 C138 348 162 348 170 380 C178 412 202 412 210 380"/>
  <line class="wire" x1="210" y1="380" x2="270" y2="380"/>
  <path class="wire" d="M270 380 C278 348 302 348 310 380 C318 412 342 412 350 380"/>
  <line class="wire" x1="350" y1="380" x2="410" y2="380"/>
  <text x="150" y="445" class="small">L1</text><text x="292" y="445" class="small">L2</text>
  <text x="80" y="468" class="small">Leq = L1 + L2，形式同电阻串联</text>

  <rect class="panel" x="530" y="275" width="440" height="210"/>
  <text class="title" x="555" y="312">电感并联</text>
  <line class="wire" x1="575" y1="380" x2="640" y2="380"/>
  <line class="wire" x1="640" y1="335" x2="640" y2="425"/>
  <line class="wire" x1="640" y1="335" x2="830" y2="335"/>
  <line class="wire" x1="640" y1="425" x2="830" y2="425"/>
  <path class="wire" d="M695 335 C703 305 727 305 735 335 C743 365 767 365 775 335"/>
  <path class="wire" d="M695 425 C703 395 727 395 735 425 C743 455 767 455 775 425"/>
  <line class="wire" x1="830" y1="335" x2="830" y2="425"/>
  <line class="wire" x1="830" y1="380" x2="930" y2="380"/>
  <text x="795" y="338" class="small">L1</text><text x="795" y="428" class="small">L2</text>
  <text x="580" y="468" class="small">1/Leq = 1/L1 + 1/L2，形式同电阻并联</text>
</svg>
