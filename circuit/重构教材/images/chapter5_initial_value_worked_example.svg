<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="560" viewBox="0 0 1080 560">
<style>
  @media (prefers-color-scheme: dark) {
    svg {
      filter: invert(1) hue-rotate(180deg) !important;
    }
  }
</style>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#111"/></marker>
    <style>text{font-family:"Microsoft YaHei","SimSun",sans-serif;font-size:18px;fill:#111}.title{font-size:24px;font-weight:700}.small{font-size:15px}.wire{stroke:#111;stroke-width:2.7;fill:none;stroke-linecap:round;stroke-linejoin:round}.thin{stroke:#111;stroke-width:1.5;fill:none}.panel{fill:#fff;stroke:#111;stroke-width:1.8;rx:8}</style>
  </defs>
  
  
<text class="title" x="40" y="45">初始值例题：先求状态，再求其它初始值</text>
  <rect class="panel" x="35" y="75" width="315" height="410"/>
  <text x="55" y="110" font-weight="700">原电路：t=0 闭合 S</text>
  <line class="wire" x1="85" y1="380" x2="300" y2="380"/><line class="wire" x1="85" y1="160" x2="85" y2="380"/>
  <circle class="thin" cx="85" cy="250" r="28"/><text class="small" x="73" y="257">12V</text>
  <line class="wire" x1="85" y1="160" x2="145" y2="160"/><polyline class="wire" points="145,160 157,140 171,180 185,140 199,180 213,140 225,160"/>
  <text class="small" x="160" y="128">4Ω</text>
  <line class="wire" x1="225" y1="160" x2="270" y2="160"/><line class="thin" x1="270" y1="160" x2="315" y2="130"/><circle cx="270" cy="160" r="5" fill="#111"/><circle cx="315" cy="160" r="5" fill="#111"/>
  <text class="small" x="276" y="118">S</text><line class="wire" x1="315" y1="160" x2="315" y2="380"/>
  <line class="wire" x1="255" y1="250" x2="255" y2="330"/><line class="wire" x1="282" y1="250" x2="282" y2="330"/><text class="small" x="235" y="235">C=0.5F</text>
  <text class="small" x="55" y="430">t&lt;0 开关断开，C 无通路：</text>
  <text class="small" x="55" y="455">uC(0-)=0V</text>

  <rect class="panel" x="390" y="75" width="300" height="410"/>
  <text x="410" y="110" font-weight="700">0+ 等效图</text>
  <line class="wire" x1="440" y1="380" x2="640" y2="380"/><line class="wire" x1="440" y1="160" x2="440" y2="380"/>
  <circle class="thin" cx="440" cy="250" r="28"/><text class="small" x="428" y="257">12V</text>
  <line class="wire" x1="440" y1="160" x2="500" y2="160"/><polyline class="wire" points="500,160 512,140 526,180 540,140 554,180 568,140 580,160"/>
  <line class="wire" x1="580" y1="160" x2="640" y2="160"/><line class="wire" x1="640" y1="160" x2="640" y2="380"/>
  <circle class="thin" cx="640" cy="270" r="28"/><text class="small" x="633" y="266">0V</text><text class="small" x="633" y="290">C</text>
  <line class="thin" marker-end="url(#arrow)" x1="575" y1="130" x2="625" y2="130"/><text class="small" x="575" y="120">i(0+)</text>
  <text class="small" x="410" y="430">电容用 uC(0-)=0V 电压源代替</text>
  <text class="small" x="410" y="455">所以 i(0+)=12/4=3A</text>

  <rect class="panel" x="730" y="75" width="315" height="410"/>
  <text x="750" y="110" font-weight="700">∞ 稳态图</text>
  <line class="wire" x1="780" y1="380" x2="995" y2="380"/><line class="wire" x1="780" y1="160" x2="780" y2="380"/>
  <circle class="thin" cx="780" cy="250" r="28"/><text class="small" x="768" y="257">12V</text>
  <line class="wire" x1="780" y1="160" x2="840" y2="160"/><polyline class="wire" points="840,160 852,140 866,180 880,140 894,180 908,140 920,160"/>
  <line class="wire" x1="920" y1="160" x2="995" y2="160"/>
  <line class="wire" x1="995" y1="240" x2="995" y2="320"/><line class="wire" x1="965" y1="240" x2="965" y2="320"/>
  <text class="small" x="900" y="235">C 开路</text>
  <text class="small" x="750" y="430">稳态电流为 0，电阻压降为 0</text>
  <text class="small" x="750" y="455">uC(∞)=12V</text>
</svg>
