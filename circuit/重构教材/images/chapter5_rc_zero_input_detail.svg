  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#111"/></marker><style>text{font-family:"Microsoft YaHei","SimSun",sans-serif;font-size:18px;fill:#111}.title{font-size:24px;font-weight:700}.small{font-size:15px}.wire,.axis{stroke:#111;stroke-width:2.7;fill:none;stroke-linecap:round;stroke-linejoin:round}.curve{stroke:#111;stroke-width:3;fill:none}.panel{fill:#fff;stroke:#111;stroke-width:1.8;rx:8}</style></defs>
  
  
<rect class="panel" x="35" y="35" width="910" height="370"/>
  <text class="title" x="60" y="72">RC 零输入：电容原来带电，换路后通过 R 放电</text>
  <line class="wire" x1="80" y1="290" x2="320" y2="290"/><line class="wire" x1="80" y1="145" x2="80" y2="290"/>
  <line class="wire" x1="80" y1="145" x2="165" y2="145"/><polyline class="wire" points="165,145 177,125 191,165 205,125 219,165 233,125 245,145"/>
