  <line class="wire" x1="295" y1="190" x2="295" y2="250"/><line class="wire" x1="320" y1="190" x2="320" y2="250"/>
  <text class="small" x="160" y="112">R</text><text class="small" x="285" y="180">uC(0+)=U0</text>
  <line class="axis" marker-end="url(#arrow)" x1="500" y1="300" x2="860" y2="300"/><line class="axis" marker-end="url(#arrow)" x1="520" y1="320" x2="520" y2="135"/>
  <path class="curve" d="M520 150 C590 205 700 280 860 298"/>
  <text class="small" x="540" y="135">U0</text><text class="small" x="865" y="320">t</text><text class="small" x="555" y="350">uC(t)=U0 e^(-t/RC)，最终为 0</text>
