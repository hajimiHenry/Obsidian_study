<svg xmlns="http://www.w3.org/2000/svg" width="920" height="360" viewBox="0 0 920 360">
<style>
  @media (prefers-color-scheme: dark) {
    svg {
      filter: invert(1) hue-rotate(180deg) !important;
    }
  }
</style>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111"/>
    </marker>
    <style>
      text{font-family:"Microsoft YaHei","SimSun",sans-serif;font-size:22px;fill:#111}
      .small{font-size:18px}
      .wire{stroke:#111;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
      .thin{stroke:#111;stroke-width:2;fill:none}
      .box{fill:#fff;stroke:#111;stroke-width:2;rx:8}
    </style>
  </defs>
  
  
<text x="40" y="45" font-weight="700">电容：状态量是 uC(t)</text>
  <line class="wire" x1="60" y1="130" x2="230" y2="130"/>
  <line class="wire" x1="230" y1="90" x2="230" y2="170"/>
  <line class="wire" x1="260" y1="90" x2="260" y2="170"/>
  <line class="wire" x1="260" y1="130" x2="430" y2="130"/>
  <line class="thin" marker-end="url(#arrow)" x1="80" y1="95" x2="200" y2="95"/>
  <text x="110" y="85" class="small">iC(t)</text>
  <text x="220" y="205">C</text>
  <text x="210" y="72" class="small">+</text>
  <text x="274" y="72" class="small">-</text>
  <text x="190" y="235" class="small">iC = C · duC/dt</text>
  <rect class="box" x="105" y="260" width="270" height="55"/>
  <text x="134" y="295" class="small">WC = 1/2 · C · uC²</text>

  <text x="510" y="45" font-weight="700">电感：状态量是 iL(t)</text>
  <line class="wire" x1="530" y1="130" x2="620" y2="130"/>
  <path class="wire" d="M620 130 C630 90 660 90 670 130 C680 170 710 170 720 130 C730 90 760 90 770 130"/>
  <line class="wire" x1="770" y1="130" x2="880" y2="130"/>
  <line class="thin" marker-end="url(#arrow)" x1="550" y1="95" x2="675" y2="95"/>
  <text x="585" y="85" class="small">iL(t)</text>
  <text x="685" y="205">L</text>
  <text x="615" y="235" class="small">uL = L · diL/dt</text>
  <rect class="box" x="585" y="260" width="270" height="55"/>
  <text x="615" y="295" class="small">WL = 1/2 · L · iL²</text>
  <text x="56" y="340" class="small">记忆性来自储能：电容记住电压，电感记住电流；直流稳态下 C 开路，L 短路。</text>
</svg>
